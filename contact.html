<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Rajendra Swain</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
</head>

<body>

  <div id="navbar"></div>

  <section class="contact-hero">
    <div class="container contact-grid">

      <!-- LEFT -->
      <div class="contact-left">
        <span class="badge">GET IN TOUCH</span>

        <h1>
          Let’s Build<br>
          Something <span class="accent">Great</span>
        </h1>

        <p class="desc">
          Have a project in mind or just want to say hello?
          I’d love to hear from you.
        </p>

        <div class="contact-info">
          <div class="info">
            <div class="icon">✉</div>
            <div>
              <p>Email</p>
              <span><a href="mailto:swain.rs009@gmail.com">swain.rs009@gmail.com</a></span>
            </div>
          </div>

          <div class="info">
            <div class="icon">📞</div>
            <div>
              <p>Phone</p>
              <span><a href="tel:+919876543210">+91 98765 43210</a></span>
            </div>
          </div>

          <div class="info">
            <div class="icon">📍</div>
            <div>
              <p>Location</p>
              <span>Bhubaneswar, Odisha, India</span>
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT (MAP) -->
      <div class="contact-map">
        <form id="contactForm" novalidate>

                <div class="form-group">
                  <input type="text" id="name" placeholder="Your name">
                  <span class="error" id="nameError"></span>
                </div>

                <div class="form-group">
                  <input type="email" id="email" placeholder="Email">
                  <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                  <input type="text" id="subject" placeholder="Subject">
                </div>

               <div class="form-group">
                  <select id="reason">
                    <option value="" disabled selected hidden>Select a Service</option>
                    <option value="collaboration">Collaboration</option>
                    <option value="support">Support</option>
                    <option value="it-related">IT Related</option>
                    <option value="financial">Financial</option>
                    <option value="nutrition">Nutrition</option>
                    <option value="feedback">Feedback</option>
                  </select>
                  <span class="error" id="reasonError"></span>
                </div>

                <div class="form-group">
                  <textarea id="message" placeholder="Write your message"></textarea>
                  <span class="error" id="messageError"></span>
                </div>

                <button type="submit" class="btn btn-dark arrow-btn">
                  Send a Message <span class="arrow-icon">→</span>
                </button>

              </form>
      </div>

    </div>
  </section>

  <div id="social-bar"></div>

  <div id="footer"></div>

<div id="toast-container"></div>

  <!-- libs -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>


  <script src="js/load.js"></script>
  <script src="js/main.js"></script>


  <!-- your code -->

</body>

</html>
